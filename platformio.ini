[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; The default ESP32 partition table provides two OTA-capable app slots.
board_build.partitions = default.csv

; Keep the firmware quiet until application-level logging is initialized.
build_flags =
    -DCORE_DEBUG_LEVEL=0

[platformio]
description = Base firmware for an ESP32 S0 electricity-meter gateway
